name: Resume — Publish PDF

on:
  push:
    branches:
      - master

  workflow_dispatch: # allow manual trigger

permissions:
  contents: write # needed to create/update releases

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Install md-to-pdf
        run: npm install -g md-to-pdf

      - name: Convert resume.md to PDF
        run: |
          cat resume.md | npx md-to-pdf \
            --highlight-style github \
            --stylesheet .github/resume.css \
            --launch-options '{"args":["--no-sandbox"]}' \
            > benjamin-smith-resume.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: benjamin-smith-resume
          path: benjamin-smith-resume.pdf

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Resume ${{ steps.tag.outputs.new_tag }}
          body: |
            ${{ steps.tag.outputs.changelog }}

            Built from [resume.md](https://github.com/${{ github.repository }}/blob/master/resume.md) — auto-published on push.
          files: benjamin-smith-resume.pdf
          make_latest: true
